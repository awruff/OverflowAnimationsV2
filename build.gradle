plugins {
	id 'org.jetbrains.kotlin.jvm' version '2.4.10'
	id 'fabric-loom' version '1.18-SNAPSHOT'
	id 'ploceus' version '1.18-SNAPSHOT'
}

base {
	archivesName = project.archives_base_name
}
version = "${project.version}+${project.minecraft_version}-ornithe"
group = project.maven_group

configurations.configureEach {
	exclude group: 'org.lwjgl.lwjgl'
}

repositories {
	maven { url = 'https://repo.polyfrost.org/releases' }
	maven { url = 'https://repo.polyfrost.org/snapshots' }
	maven { url = 'https://maven.cloverclient.com/releases' }
	maven { url = 'https://maven.taumc.org/releases' }
	maven { url = 'https://api.modrinth.com/maven' }
	maven { url = 'https://maven.pkg.jetbrains.space/public/p/compose/dev' }
	google()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	mappings ploceus.featherMappings(project.feather_build)

	ploceus.dependOsl(project.osl_version)

	modImplementation "org.polyfrost.oneconfig:${project.minecraft_version}-ornithe:${project.oneconfig_version}"
	for (module in ['config', 'config-impl', 'internal', 'ui', 'utils']) {
		implementation "org.polyfrost.oneconfig:$module:${project.oneconfig_version}"
	}
	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_language_kotlin_version}"

	modCompileOnly("maven.modrinth:overflowparticles:${project.overflowparticles_version}") { transitive = false }
	modCompileOnly("dev.rdh:argentum:${project.argentum_version}") { transitive = false }
	compileOnly 'org.joml:joml:1.10.5'
	modLocalRuntime("dev.rdh:argentum:${project.argentum_version}") { transitive = false }
	// jar-in-jar isn't loaded from dev deps
	localRuntime "org.embeddedt.celeritas:celeritas-common:${project.celeritas_version}"
	localRuntime 'org.joml:joml:1.10.5'
}

loom {
	runConfigs.remove(runConfigs.server)
}

processResources {
	def props = [
		id                   : project.archives_base_name,
		name                 : project.mod_name,
		version              : project.version,
		description          : project.mod_description,
		source               : project.mod_source,
		issues               : project.mod_issues,
		license              : project.mod_license,
		fabric_loader_version: project.loader_version,
		minecraft_version    : project.minecraft_version,
	]
	inputs.properties props

	filesMatching('fabric.mod.json') {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 25
}

kotlin {
	jvmToolchain 25
}

java {
	withSourcesJar()
}

jar {
	from('LICENSE') {
		rename { "${it}_${base.archivesName.get()}" }
	}
}
